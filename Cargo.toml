[package]
name = "pollux-fs-interpose-poc"
version = "0.1.0"
edition = "2021"
description = "macOS-only PoC: DYLD_INSERT_LIBRARIES interposition of open()/openat() gated by a real Pollux Core ALLOW/DENY decision reached through the unmodified pollux-polyglot-native-bridge. Not a security boundary — see README.md."
publish = false

[lib]
name = "pollux_fs_interpose_poc"
path = "src/lib.rs"
# cdylib: what DYLD_INSERT_LIBRARIES actually loads into the governed
# process. rlib: lets `cargo test` build and run this crate's own unit
# tests (the reentrancy-guard tests in src/guard.rs) the normal way.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poc-fixture"
path = "src/bin/poc_fixture.rs"

[dependencies]
# Path dependency on the existing, unmodified Bridge — never rewritten,
# never reimplemented. This crate consumes it exactly as any other
# consumer would: PolluxEngine::load / PolluxEngine::evaluate.
pollux-polyglot-native-bridge = "0.1.0"

[lints.rust]
# `DYLD_INSERT_LIBRARIES` interposition and raw dlsym/libc calls are the
# entire point of this crate — see src/sys.rs.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
